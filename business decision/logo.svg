<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Corporate color gradients matching our new slate/indigo theme -->
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>
    <!-- Drop shadow for the central decision node -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Decision Nodes & Tree Lines -->
  <!-- Main Decision Stem -->
  <path d="M 50,85 L 50,55" stroke="url(#purpleGrad)" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.8"/>
  
  <!-- Branching Paths -->
  <path d="M 50,55 C 50,45 25,45 25,25" stroke="url(#glowGrad)" stroke-width="4" stroke-linecap="round" fill="none"/>
  <path d="M 50,55 C 50,45 75,45 75,25" stroke="url(#purpleGrad)" stroke-width="4" stroke-linecap="round" fill="none"/>
  <path d="M 50,55 L 50,20" stroke="url(#glowGrad)" stroke-width="3" stroke-linecap="round" stroke-dasharray="3 3" fill="none" opacity="0.6"/>

  <!-- Choice Nodes -->
  <circle cx="25" cy="25" r="7" fill="#0b0f19" stroke="url(#glowGrad)" stroke-width="3" />
  <circle cx="25" cy="25" r="3" fill="#3b82f6" />

  <circle cx="75" cy="25" r="7" fill="#0b0f19" stroke="url(#purpleGrad)" stroke-width="3" />
  <circle cx="75" cy="25" r="3" fill="#6366f1" />

  <circle cx="50" cy="20" r="6" fill="#0b0f19" stroke="url(#glowGrad)" stroke-width="2.5" />
  <circle cx="50" cy="20" r="2" fill="#3b82f6" />

  <!-- Core Decision Center Node (AI Core) -->
  <circle cx="50" cy="55" r="10" fill="#0b0f19" stroke="url(#glowGrad)" stroke-width="4" filter="url(#glow)"/>
  <!-- Glowing central dot -->
  <circle cx="50" cy="55" r="4" fill="#3b82f6">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="2.5s" repeatCount="indefinite" />
  </circle>

  <!-- Small details/metrics graph lines -->
  <line x1="20" y1="65" x2="35" y2="65" stroke="#94a3b8" stroke-width="1.5" opacity="0.3" stroke-linecap="round" />
  <line x1="20" y1="70" x2="30" y2="70" stroke="#94a3b8" stroke-width="1.5" opacity="0.3" stroke-linecap="round" />
  <line x1="65" y1="65" x2="80" y2="65" stroke="#94a3b8" stroke-width="1.5" opacity="0.3" stroke-linecap="round" />
  <line x1="70" y1="70" x2="80" y2="70" stroke="#94a3b8" stroke-width="1.5" opacity="0.3" stroke-linecap="round" />
</svg>
